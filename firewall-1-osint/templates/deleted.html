{% extends "base.html" %}
{% block title %}Post #{{ post.id }} · {{ SITE_NAME }}{% endblock %}
{% block content %}
  <div class="panel">
    <div class="panel-h">Post #{{ post.id }}</div>
    <div class="deleted-wrap">
      <div class="ghost">👻</div>
      <h2>This post has been deleted</h2>
      <p>This post is no longer available.</p>
      <span class="tag-pill">status: deleted · id #{{ post.id }}</span>
    </div>
  </div>
  <div style="margin-top:14px"><a href="{{ url_for('feed') }}" style="color:var(--blue);font-weight:600">&larr; Back to Home</a></div>
{% endblock %}
