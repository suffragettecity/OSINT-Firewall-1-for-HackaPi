{% macro avatar(name, color, cls='') -%}
  <span class="avatar {{ cls }}" style="background:#{{ color or '2563eb' }}">
    {{- (name or '?')[:1] | upper -}}{{- (name.split(' ')[1][:1] | upper) if name and ' ' in name else '' -}}
  </span>
{%- endmacro %}

{%- endmacro %}
